# Publishes server.json to the official MCP Registry via GitHub OIDC —
# no stored token; the io.github.aurumflux20/* namespace is proven by
# this workflow running in this repo. Requires the PyPI README to carry
# the `mcp-name:` line (ownership proof for the pypi package entry).
name: Publish to MCP Registry

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # DISCOVER the asset URL; never construct it. Two earlier cuts of this
          # step guessed the filename (`uname -m` where Go says amd64, then a
          # version-stamped name) and both 404'd — the second silently piping an
          # error page into tar. The release JSON already carries the exact
          # download URL, so ask for it and match on the asset name instead.
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/modelcontextprotocol/registry/releases/latest > release.json
          URL="$(jq -r '.assets[].browser_download_url
                        | select(test("(?i)(linux).*(amd64|x86[-_]64).*\\.tar\\.gz$"))' release.json | head -1)"
          if [ -z "$URL" ]; then
            echo "No linux/amd64 tarball in the latest release. Assets present:"
            jq -r '.assets[].name' release.json
            exit 1
          fi
          echo "Downloading $URL"
          curl -fSL "$URL" -o publisher.tar.gz
          tar xzf publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
