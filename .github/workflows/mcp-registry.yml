# Publishes server.json to the official MCP Registry via GitHub OIDC —
# no stored token; the io.github.aurumflux20/* namespace is proven by
# this workflow running in this repo. Requires the PyPI README to carry
# the `mcp-name:` line (ownership proof for the pypi package entry).
name: Publish to MCP Registry

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # Release assets are named mcp-publisher_<version>_<os>_<goarch>.tar.gz.
          # The first cut of this workflow used `uname -m` (x86_64) where Go
          # names it amd64, and dropped the version entirely — so the URL 404'd
          # and an HTML error page got piped into tar ("not in gzip format").
          # Resolve the real version and map the arch; `curl -f` fails loudly on
          # a bad URL instead of silently handing garbage to tar.
          VERSION="$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
            | grep -oP '"tag_name":\s*"v?\K[^"]+')"
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64)         ARCH=amd64 ;;
            aarch64|arm64)  ARCH=arm64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          URL="https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/mcp-publisher_${VERSION}_${OS}_${ARCH}.tar.gz"
          echo "Downloading $URL"
          curl -fSL "$URL" | tar xz mcp-publisher
          ./mcp-publisher --version
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
