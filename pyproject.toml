[project]
name = "seal-kernel"
version = "0.2.0"
description = "Exactly-once admission for irreversible agent actions, world-confirmed settlement, and effect graphs with compensating seals — on a shared Postgres, with a tamper-evident certificate chain."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AurumFlux", email = "hello@aurumflux.co" }]
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
signing = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/aurumflux20/seal"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["seal"]
